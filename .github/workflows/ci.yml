name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Run automated behavior acceptance
        run: npm run behavior:acceptance -- --output-root build/behavior-acceptance

      - name: Upload behavior acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-acceptance
          path: build/behavior-acceptance
          if-no-files-found: warn
